name: Validate and lint code

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'main'

env:
  POETRY_CACHE_DIR: ~/.cache/pypoetry
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python ${{ env.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "poetry"

      - name: Install poetry dependencies
        run: poetry install

      - name: Run ruff check
        run: poetry run ruff check --output-format=github

      - name: Run ruff format
        run: poetry run ruff format --check

      - name: Run pyright
        run: poetry run pyright

      - name: Bewaak wie de inhoud mag wijzigen
        if: github.event_name == 'pull_request'
        run: poetry run script/check-mode origin/${{ github.base_ref }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "poetry"

      - name: Install poetry dependencies
        run: poetry install

      - name: Run tests
        run: poetry run script/test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build container
        run: docker build --build-arg REGISTRY_VERSION=ci -t instrument-registry:ci .
